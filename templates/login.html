{% extends "base.html" %}
{% block title %}Login – Vivaha Muhurthum{% endblock %}

{% block content %}
<div class="card" style="max-width:420px; margin: 0 auto;">
  <h2 class="section-title">Login</h2>
  {% if error %}
  <div style="background:#FFE2E2;color:#8B1A1A;padding:0.9rem 1rem;border-radius:12px;margin-bottom:1rem;">
    {{ error }}
  </div>
  {% endif %}
  <form method="post">
    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="form-control" type="email" name="email" required autofocus>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-control" type="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary">Login</button>
  </form>
  <p style="margin-top:1rem;color:var(--text-light);">New user? <a href="/signup">Create an account</a>.</p>
</div>
{% endblock %}
